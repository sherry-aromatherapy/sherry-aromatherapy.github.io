title: "雪莉的芳療觀點"
description: "當芳療說法互相矛盾時，怎麼判斷？陪你拆解資訊來源，找到在生活中安心使用精油、純露、植物油的方法"
author: "雪莉 Sherry"
email: "sherry.aromatherapy@gmail.com"

# Update this once the site has a home on GitHub Pages, e.g.:
# url: "https://sherry-aromatherapy.github.io"
# baseurl: "/blog"
url: "https://sherry-aromatherapy.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  footnote_nr: 1

permalink: /:slug/

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

nav:
  - title: "從這裡開始"
    url: "/start-here/"
  - title: "芳療文章"
    url: "/archive/"
  - title: "關於雪莉"
    url: "/info/"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
